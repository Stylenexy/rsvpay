[package]
name = "amplop_balas"
version = "0.1.0"
edition = "2021"
description = "Amplop Balas: a wedding-gift NFT that holds its own money, remembers who gave, and helps reply when the giver hosts their own celebration"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
