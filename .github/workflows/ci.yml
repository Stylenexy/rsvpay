name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo test
      - run: cargo build --target wasm32-unknown-unknown --release

  code-on-chain:
    name: Rebuild the wasm and compare it with the chain
    runs-on: windows-latest
    env:
      # The deployed wasm was built on Windows with this cargo home. Panic messages of the
      # dependencies carry their source path, so that path is part of the bytes on chain.
      CARGO_HOME: C:\Users\MSI\.cargo
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.99.1, as pinned in contracts/rust-toolchain.toml
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - name: Release build
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release --locked
      - name: Same hash as rsvpay-v2.testnet
        run: node scripts/code-hash.mjs contracts/target/wasm32-unknown-unknown/release/amplop_balas.wasm rsvpay-v2.testnet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
